<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .fs-3 {
            font-size: 1.5em;        
        }
        .fsrem-3{
            font-size: 1.5rem;
        }
        .fs-150{
            font-size: 150%;
        }
        html {
            font-size: 24px; /* Tamaño de fuente base */
        }
        .border-1 {
            border: 1em solid black;
            padding: 10px;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="fs-3">
        <p class="border-1">This is a paragraph with a font size of 3 (1.75rem).</p>
        <p class="fs-3 border-1">This is the default font size.</p>
    </div>
    <a href="https://www.lacabramecanica.es">Hola</a>
</body>
</html>

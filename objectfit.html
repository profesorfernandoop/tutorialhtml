<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <title>Document</title>
    <style>
      .wrapper {
        display: flex;
        align-items: flex-start;
      }

      .wrapper > * {
        margin: 20px;      }

      .box {
        border: 5px solid darkblue;
        width: 100px;
        height: 66px;
      }
      
      .box-300-200{
              border: 5px solid darkblue;
        width: 300px;
        height: 200px;
      } 
     .box-300-200{
              border: 5px solid darkblue;
        width: 300px;
        height: 200px;
      } 

      img {
        width: 100%;
        height: 100%; 
      } 

      .cover {
        object-fit: cover;
        object-position:right;
      }

      .contain {
        object-fit: contain;
      }
      .fill {
        object-fit: fill;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <p>Cover</p>
      <div class="box">
        <img
          alt="balloons"
          class="cover"
          src="resources/img/balloons.jpg"
        >
      </div>
      <p>Contain</p>
      <div class="box">
        <img
          alt="balloons"
          class="contain"
          src="resources/img/balloons.jpg"
        >
      </div>
      <p>Fill</p>
      <div class="box">
        <img
          alt="balloons"
          class="fill"
           src="resources/img/balloons.jpg"
        >
      </div>

    </div>
    <div class="wrapper">
      <p>Cover</p>
      <div class="box-300-200">
        <img
          alt="star"
          src="/resources/img/star.png"
          class="cover"
        >
      </div>
        <p> Contain</p>
      <div class="box-300-200">
        <img
          alt="star"
          src="/resources/img/star.png"
          class="contain"
        >
      </div>
      <p>Fill</p>
      <div class="box-300-200">
        <img
          alt="star"
          src="/resources/img/star.png"
          class="fill"
        >
      </div>

    </div>
  </body>
</html>

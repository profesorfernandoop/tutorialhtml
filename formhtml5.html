    <div class="container">
        <header>

       <main>
            <nav>
                <ul class="menu">

                    <li class="menuitem"><a href="formhtml5.html">Form html5</a></li>
                </ul>
            </nav>
            <div id="content">
                <div id="formhtml5">
                    <form action="pagina.php" 
                          method="POST"
                          oninput="result.value=parseInt(rango.value)">
                    <h1 class="azulcobalto centrar">Controles HTML5</h1>
                    <ul class="formulario">
                        <li>
                            <label for="email">Email:</label>
                               <input type="email" id="email" name="email" placeholder="Dirección de correo"/>
                           </li>
                        <li>
                            <label for="url">Url:</label>
                               <input type="url" id="url" name="url" required/>
                        </li>   
                        <li>
                            <label for="fecha">Fecha</label>
                               <input type="date" id="fecha" name="fecha" />
                        </li>  
                        <li>
                            <label for="hora">Hora</label>
                               <input type="time" id="fecha" name="hora" />
                        </li> 
                        <li>
                            <label for="fechahora">Fecha y hora cita</label>
                               <input type="datetime-local" 
                                      id="fechahora" 
                                      name="fechahora" />
                        <li>   
                        <li>
                                <label for="mes">Mes</label>
                                   <input type="month" id="mes" name="mes" />
                        <li>  
                        <li>
                                <label for="semana">Semana</label>
                                   <input type="week" id="semana" name="semana" />
                        <li>  
                        <li>
                                <label for="telefono">Telefono</label>
                                   <input type="tel" id="telefono" name="telefono" />
                        </li>   
                        <li>
                            <label for="numero">Número</label>
                               <input type="number" id="numero" name="numero" min="0" max="100" step="5" />
                        </li>                          
                        <li>
                            <label for="rango">Rango</label>
                               <input type="range" id="rango" name="rango" min="0" max="100" step="5"  />
                               <output name="result" for="rango">50</output>
                        </li>  
                        <li>
                            <label for="color">Color</label>
                               <input type="color" id="color" name="color" />
                        </li>     
                        <li>
                            <label for="busqueda">Búsqueda</label>
                               <input type="search" id="busqueda" name="busqueda" />
                        </li>
                        <li>
                            <button type="submit">Enviar</button>
                        </li>                                                
                    </ul>
                    </form>
                </div>
            </main>
        </div>

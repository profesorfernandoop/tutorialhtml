<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejemplo Blockquote</title>
  <style>
    blockquote {
      margin: 20px;
      padding: 10px;
      border-left: 5px solid #7a7a7ade;
      background-color: #f9f9f9;
      font-style: italic;
      color:black
    }
  </style>
</head>
<body>
  <blockquote cite="https://www.ejemplo.com/cita-original">
    <p>
    La vida es lo que pasa mientras estás ocupado haciendo otros planes.</p>
  </blockquote>
</body>
</html>

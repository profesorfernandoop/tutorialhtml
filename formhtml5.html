    <link rel="stylesheet" href="resources/css/stackoverflow-light.min.css">
    <script src="resources/js/highlight.min.js"></script>
    <script>hljs.initHighlightingOnLoad();</script>
</head>

<body>
    <div class="container">
        <header>
        </header>
        <main>
            <nav>
                <ul class="menu">
                    <li class="menuitem"><a href="index.html">Home</a></li>
                    <li class="menuitem"><a href="texto.html">Elementos de texto</a></li>
                    <li class="menuitem"><a href="enlaces.html">Hipervinculos</a></li>

                    <li class="menuitem"><a href="formpago.html">Formulario de pago</a></li>
                    <li class="menuitem"><a href="formhtml5.html">Form html5</a></li>
                </ul>
            </nav>
            <div id="content">
                <div id="formhtml5">
                    <form action="pagina.php" method="POST" oninput="resultado.value=parseInt(rango.value)">
                        <h1 class="azulcobalto centrar">Controles HTML5</h1>
                        <p>
                            <label for="email">Email:</label>
                            <input type="email" id="email" name="email" placeholder="Dirección de correo">
                        </p>
                        <p>
                            <label for="url">Url:</label>
                            <input type="url" id="url" name="url" required>
                        </p>
                        <p>
                            <label for="fecha">Fecha</label>
                            <input type="date" id="fecha" name="fecha">
                        </p>
                        <p>
                            <label for="hora">Hora</label>
                            <input type="time" id="hora" name="hora">
                        </p>
                        <p>
                            <label for="fechahora">Fecha y hora cita</label>
                            <input type="datetime-local" id="fechahora" name="fechahora">
                        </p>
                        <p>
                            <label for="mes">Mes</label>
                            <input type="month" id="mes" name="mes">
                        </p>
                        <p>
                            <label for="semana">Semana</label>
                            <input type="week" id="semana" name="semana">
                        </p>
                        <p>
                            <label for="telefono">Telefono</label>
                            <input type="tel" id="telefono" name="telefono">
                        </p>
                        <p>
                            <label for="numero">Número</label>
                            <input type="number" id="numero" name="numero" min="0" max="100" step="5">
                        </p>
                        <p>
                            <label for="rango">Rango</label>
                            <input type="range" id="rango" name="rango" min="0" max="100" step="5">
                            <output name="resultado" for="rango">50</output>
                        </p>
                        <p>
                            <label for="color">Color</label>
                            <input type="color" id="color" name="color">
                        </p>
                        <p>
                            <label for="busqueda">Búsqueda</label>
                            <input type="search" id="busqueda" name="busqueda">
                        </p>
                        <p>
                            <button type="submit">Enviar</button>
                        </p>
                    </form>
                </div>
            </div>
        </main>
        <footer>
            <h2>&copy;VS1ASIR <span id="year"></span></h2>
        </footer>
        <script src="resources/js/autoyear.js"></script>
        </script>
    </div>
